name: Changeset Status

on:
  pull_request:
    branches: [main, master]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  changeset-status:
    name: Changeset Status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install release tooling
        run: npm ci

      - name: Report changeset status
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set +e
          OUTPUT=$(npx changeset status --since="origin/${BASE_BRANCH}" 2>&1)
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            printf '%s\n' "$OUTPUT"
            {
              echo "## Changeset status"
              echo
              echo "This PR includes a changeset and will contribute to the next release."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$STATUS" -eq 1 ] && printf '%s\n' "$OUTPUT" | grep -qiE 'no unreleased changesets|no changesets'; then
            printf '%s\n' "$OUTPUT"
            {
              echo "## Changeset status"
              echo
              echo "> [!WARNING]"
              echo "> No changeset was found for this PR."
              echo
              echo "This is allowed for maintenance, docs, CI, dependency, and other non-app-impacting work."
              echo "If this PR changes user-visible app behavior, add a changeset with \`npm run changeset\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Changeset status"
              echo
              echo "> [!CAUTION]"
              echo "> \`changeset status\` failed with exit code ${STATUS}."
              echo
              echo '```text'
              printf '%s\n' "$OUTPUT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$STATUS"
          fi

          exit 0
