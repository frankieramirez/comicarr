name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  changesets:
    name: Changesets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      should_release: ${{ steps.prepare.outputs.should_release }}
      tag_name: ${{ steps.prepare.outputs.tag_name }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install release tooling
        run: npm ci

      - name: Create or update version PR
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v1
        with:
          version-script: npm run version-packages
          pr-title: Version Packages
          commit-message: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare GitHub release
        id: prepare
        if: steps.changesets.outputs['has-changesets'] == 'false'
        run: npm run prepare-github-release

      - name: Create GitHub release
        if: steps.prepare.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.prepare.outputs.tag_name }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.prepare.outputs.tag_name }}" \
            --notes-file "${{ steps.prepare.outputs.release_notes_path }}"

  docker-build:
    name: Docker Build
    needs: changesets
    if: needs.changesets.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Docker Hub is a mirror; GHCR is canonical. Surfaced as env because the
      # `secrets` context is not available to step-level `if:` conditions.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Docker Hub tags are added only when credentials exist, so a release
      # never fails on the mirror. Absence is logged, never silent.
      - name: Resolve image tags
        id: tags
        env:
          VERSION: ${{ needs.changesets.outputs.version }}
        run: |
          {
            echo 'value<<TAGS_EOF'
            echo "ghcr.io/frankieramirez/comicarr:latest"
            echo "ghcr.io/frankieramirez/comicarr:${VERSION}"
            if [ -n "$DOCKERHUB_TOKEN" ]; then
              echo "docker.io/comicarr/comicarr:latest"
              echo "docker.io/comicarr/comicarr:${VERSION}"
            fi
            echo TAGS_EOF
          } >> "$GITHUB_OUTPUT"

          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "::notice::Publishing to GHCR and Docker Hub."
          else
            echo "::warning::DOCKERHUB_TOKEN is not set — publishing to GHCR only. docker.io/comicarr/comicarr will not receive ${VERSION}."
          fi

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.value }}
          build-args: |
            COMICARR_BUILD_ID=${{ needs.changesets.outputs.tag_name }}
            COMICARR_BUILD_COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=ghcr.io/frankieramirez/comicarr:buildcache
          cache-to: type=registry,ref=ghcr.io/frankieramirez/comicarr:buildcache,mode=max

      # Without this the Docker Hub landing page the homepage links to is blank.
      - name: Sync Docker Hub description
        if: env.DOCKERHUB_TOKEN != ''
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: comicarr/comicarr
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./README.md
          enable-url-completion: true
