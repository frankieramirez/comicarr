      <path transform="translate(414)" d="M0 112V24H12V12H24V0H52V12H64V24H76V112H48V76H28V112ZM28 28V52H48V28Z"/>
      <path transform="translate(500)" d="M0 0H64V12H76V52H64V64H52V76H64V88H76V112H48V88H36V76H28V112H0ZM28 24V48H48V24Z"/>
      <path transform="translate(586)" d="M0 0H64V12H76V52H64V64H52V76H64V88H76V112H48V88H36V76H28V112H0ZM28 24V48H48V24Z"/>
    </g>
    <mask id="letter-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="662" height="112">
      <use href="#letters" fill="#ffffff"/>
