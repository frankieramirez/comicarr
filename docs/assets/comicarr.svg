<svg xmlns="http://www.w3.org/2000/svg" width="840" height="235.2" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">Comicarr</title>
  <desc id="desc">A pixel-art comic book with a lightning-bolt cover beside orange COMICARR lettering, cream highlights, and burnt-orange shadows.</desc>
  <defs>
    <linearGradient id="letter-face" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff0cc"/>
      <stop offset=".27" stop-color="#ffd48a"/>
      <stop offset=".28" stop-color="#ffb054"/>
      <stop offset=".58" stop-color="#ff8b36"/>
      <stop offset=".59" stop-color="#ff6a1f"/>
      <stop offset="1" stop-color="#d64a12"/>
    </linearGradient>
    <pattern id="dither" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 0h4v4H0zM4 4h4v4H4z" fill="#8b321b"/>
    </pattern>
    <g id="letters" fill-rule="evenodd">
      <path d="M12 0H76V24H28V88H76V112H12V100H0V12H12Z"/>
      <path transform="translate(86)" d="M12 0H64V12H76V100H64V112H12V100H0V12H12ZM28 24V88H48V24Z"/>
      <path transform="translate(172)" d="M0 112V0H24V12H36V24H60V12H72V0H96V112H72V48H60V60H36V48H24V112Z"/>
